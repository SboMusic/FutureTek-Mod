# Memoria usata da Gradle (2 GB aiutano durante la prima preparazione di Minecraft)
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Nomi leggibili dei parametri nel codice di Minecraft (Parchment)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Versioni di Minecraft e NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
loader_version_range=[1,)

## Proprieta' della mod
# Identificativo unico: solo minuscole, deve coincidere con FutureTek.MODID nel codice
mod_id=futuretek
mod_name=FutureTek
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.futuretek

## Mod opzionali per lo sviluppo
# JEI: versione fissata (quella scaricata al primo avvio)
jei_version=19.70.0.469
